<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ZeppOS Editor Statistics</title>
  <meta name="description" content="Usage statistics for the ZeppOS watch face editor">
  <meta name="color-scheme" content="dark light">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <script>
    // Apply saved theme before first paint to avoid a flash. Dark is the default.
    // Open the page with ?reset to forget saved theme, language and panel modes.
    try {
      if (/[?&]reset\b/.test(location.search)) {
        ["theme", "lang", "panelModes"].forEach(function (k) { localStorage.removeItem(k); });
      }
      var t = localStorage.getItem("theme");
      if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header class="topbar">
    <div class="container topbar-inner">
      <div class="brand">
        <img class="brand-logo" src="assets/icons/logo.webp" width="56" height="56" alt="">
        <div>
          <div class="brand-name" id="app-name">ZeppOS Editor</div>
          <div class="brand-sub" data-i18n="subtitle"></div>
        </div>
      </div>
      <div class="controls">
        <div class="lang-switch" role="group" data-i18n-aria="language">
          <button type="button" data-lang="en" title="English"><img class="flag" src="assets/flags/en.png" alt=""><span class="lang-code">EN</span></button>
          <button type="button" data-lang="ru" title="Русский"><img class="flag" src="assets/flags/ru.png" alt=""><span class="lang-code">RU</span></button>
          <button type="button" data-lang="uk" title="Українська"><img class="flag" src="assets/flags/uk.png" alt=""><span class="lang-code">UA</span></button>
        </div>
        <button type="button" class="icon-btn" id="theme-toggle">
          <span class="icon-moon" aria-hidden="true">🌙</span>
          <span class="icon-sun" aria-hidden="true">☀️</span>
        </button>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <h1 data-i18n="title"></h1>
      <div class="meta">
        <span id="updated"></span>
        <button type="button" class="link-btn" id="refresh">
          <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.64-6.36M21 3v6h-6"/></svg>
          <span data-i18n="refresh"></span>
        </button>
      </div>
    </section>

    <div id="error" class="error" hidden>
      <strong data-i18n="errorTitle"></strong>
      <span id="error-text"></span>
      <button type="button" class="btn" id="retry" data-i18n="retry"></button>
    </div>

    <section class="kpis" id="kpis">
      <article class="card kpi kpi-main">
        <div class="kpi-label" data-i18n="totalDevices"></div>
        <div class="kpi-value" data-kpi="total_devices">—</div>
      </article>
      <article class="card kpi">
        <div class="kpi-label" data-i18n="new7"></div>
        <div class="kpi-value" data-kpi="new_devices_7_days">—</div>
        <div class="kpi-note" data-kpi-share="new_devices_7_days"></div>
      </article>
      <article class="card kpi">
        <div class="kpi-label" data-i18n="new30"></div>
        <div class="kpi-value" data-kpi="new_devices_30_days">—</div>
        <div class="kpi-note" data-kpi-share="new_devices_30_days"></div>
      </article>
    </section>

    <section class="grid">
      <article class="card panel" data-panel="windows">
        <header class="panel-head">
          <h2 data-i18n="windows"></h2>
          <div class="segmented" role="group">
            <button type="button" data-mode="full" data-i18n="editions"></button>
            <button type="button" data-mode="grouped" data-i18n="versions"></button>
          </div>
        </header>
        <div class="bars"></div>
      </article>

      <article class="card panel" data-panel="winLang">
        <header class="panel-head">
          <h2 data-i18n="winLanguages"></h2>
          <div class="segmented" role="group">
            <button type="button" data-mode="full" data-i18n="full"></button>
            <button type="button" data-mode="grouped" data-i18n="grouped"></button>
          </div>
        </header>
        <div class="bars"></div>
      </article>

      <article class="card panel" data-panel="appLang">
        <header class="panel-head">
          <h2 data-i18n="appLanguages"></h2>
        </header>
        <div class="bars"></div>
      </article>

      <article class="card panel" data-panel="watch">
        <header class="panel-head">
          <h2 data-i18n="watchModels"></h2>
        </header>
        <div class="bars"></div>
      </article>
    </section>
  </main>

  <footer class="container footer">
    <span data-i18n="footer"></span>
  </footer>

  <script src="config.js"></script>
  <script src="assets/i18n.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
